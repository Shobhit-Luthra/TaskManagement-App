name: backup

on:
  schedule:
    - cron: "30 21 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump-prod:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DB_URL: ${{ secrets.PROD_DB_URL }}
      PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Check backup secrets
        id: gate
        run: |
          if [ -z "$DB_URL" ] || [ -z "$PASSPHRASE" ]; then
            echo "::warning::PROD_DB_URL / BACKUP_PASSPHRASE are not set. NO BACKUP WAS TAKEN. Add both repository secrets (use the session-pooler URL; runners are IPv4-only)."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.run == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Dump schema and data
        if: steps.gate.outputs.run == 'true'
        run: |
          supabase db dump --db-url "$DB_URL" -f schema.sql
          supabase db dump --db-url "$DB_URL" --data-only -f data.sql
      - name: Encrypt backup
        if: steps.gate.outputs.run == 'true'
        run: |
          tar czf dump.tgz schema.sql data.sql
          gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase "$PASSPHRASE" dump.tgz
          rm -f schema.sql data.sql dump.tgz
      - if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kanbo-prod-${{ github.run_id }}
          path: dump.tgz.gpg
          retention-days: 90

  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DEV_URL: ${{ secrets.DEV_SUPABASE_URL }}
      DEV_KEY: ${{ secrets.DEV_SUPABASE_ANON_KEY }}
      STAGING_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      STAGING_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
    steps:
      - name: Ping dev and staging so free projects do not pause
        run: |
          ping_project() {
            if [ -z "$2" ] || [ -z "$3" ]; then
              echo "::warning::$1 Supabase URL/key secret not set; skipping."
              return 0
            fi
            curl -fsS --retry 3 --max-time 20 "$2/rest/v1/" -H "apikey: $3" -o /dev/null && echo "ok $1"
          }
          ping_project dev "$DEV_URL" "$DEV_KEY"
          ping_project staging "$STAGING_URL" "$STAGING_KEY"
